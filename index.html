<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faeef2">
<meta name="description" content="A little surprise made with love.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 22'%3E%3Cpath d='M12 21C-4 10 2-1 8 2c2 1 3.5 3 4 4 .5-1 2-3 4-4 6-3 12 8-4 19z' fill='%23e0457b'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Birthday Surprise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@500;700&family=Lobster+Two:ital,wght@1,400;1,700&family=DM+Sans:wght@500;700&family=Noto+Serif:ital@1&family=Parisienne&family=Chewy&family=Great+Vibes&family=Bebas+Neue&family=Poppins:wght@600&family=Playfair+Display:wght@600&display=swap">
<style>
/* Layout: one full-screen scene at a time (lock > gifts > tulips / playlist / letter), soft pink watercolor world, single look in both themes. */
:root{
  --blush:#fde8ee; --rose:#f6b7c5; --berry:#c2446d; --wine:#7a2e48; --cream:#fff4ea; --ink:#2a1a20; --sky:#a9d3ee;
  --f-script:'Lobster Two','Dancing Script',cursive;
  --f-hand:'Dancing Script','Lobster Two',cursive;
  --f-title:'Baloo 2','Trebuchet MS',sans-serif;
  --f-chewy:'Chewy','Baloo 2','Comic Sans MS',cursive;
  --f-vibes:'Great Vibes','Lobster Two',cursive;
  --f-play:'Playfair Display',Georgia,serif;
  --f-pop:'Poppins','Baloo 2',sans-serif;
  --f-bebas:'Bebas Neue','Oswald',Impact,sans-serif;
  --f-dm:'DM Sans',system-ui,sans-serif;
  --f-cap:'Noto Serif',Georgia,serif;
  --f-flow:'Parisienne','Dancing Script',cursive;
  --f-serif:'Cormorant Garamond',Georgia,serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--blush);color:var(--wine);font-family:var(--f-title);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,label:focus-within{outline:3px solid var(--berry);outline-offset:3px}
#app{position:fixed;inset:0;background:var(--blush)}
.screen{position:absolute;inset:0;overflow:auto;display:none;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:fade .5s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.wash{background:
  radial-gradient(60% 50% at 15% 10%,#fbc9d3 0,transparent 70%),
  radial-gradient(50% 45% at 85% 30%,#fdd8de 0,transparent 70%),
  radial-gradient(55% 50% at 30% 90%,#f9bccb 0,transparent 70%),
  radial-gradient(45% 40% at 90% 95%,#fbcbd6 0,transparent 70%),#fde1e7}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;position:relative}

/* LOCK */
#s-lock{background:radial-gradient(60% 60% at 80% 0,#ffe9ef,transparent),#fdecf1}
.lock{min-height:100%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:2rem;max-width:1200px;margin:auto;position:relative}
.pics{position:relative;width:100%;max-width:640px;justify-self:center;display:flex;margin-left:-3%}
.pics label{display:block;width:56%;cursor:pointer;position:relative}
.pics label+label{margin-left:-12%}
.pics svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(194,68,109,.18))}
.pics input{position:absolute;opacity:0;width:1px;height:1px}
.pad{display:flex;flex-direction:column;align-items:center;gap:1.1rem;justify-self:center;width:min(340px,100%)}
.pad h1{font:italic 700 clamp(2rem,4.6vw,3.4rem)/1.1 var(--f-script);color:#c9577f;margin:0;text-align:center;text-wrap:balance}
.dots{display:flex;gap:.7rem}
.dot{width:clamp(48px,6vw,64px);height:clamp(44px,5.5vw,58px);border-radius:14px;background:#fff7ef;border:1px solid #f1d9d6;box-shadow:0 3px 6px rgba(194,68,109,.12);display:grid;place-items:center;color:#f4c9d2;font-size:1.3rem;transition:transform .2s}
.dot.f{color:var(--berry)}
.dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{height:1.3rem;margin:-.4rem 0 -.2rem;font-size:.85rem;font-weight:700;color:var(--wine);letter-spacing:.02em}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;width:100%}
.key{height:clamp(46px,7vh,60px);border-radius:16px;background:#fff6ec;border:1px solid #f1dcd5;box-shadow:0 4px 8px rgba(194,68,109,.14);font:600 1.7rem var(--f-serif);font-variant-numeric:oldstyle-nums;color:var(--wine);transition:transform .12s,background .2s}
.key:active{transform:scale(.94)}
.key.go{background:var(--berry);color:#fff;border-color:var(--berry)}
.key.go:disabled{background:#f6c5d2;border-color:#f6c5d2;box-shadow:none;cursor:default}
.nextbtn,.next{background:#fff6ec;border:1px solid #f1dcd5;border-radius:999px;padding:.35rem 1.6rem;font-weight:800;color:var(--berry);box-shadow:0 3px 8px rgba(194,68,109,.15);font-size:1rem}
.nextbtn[hidden]{display:none}
.next{position:absolute;right:1.2rem;top:1.2rem;z-index:5}
.bow-tr{position:absolute;right:-1%;top:-2%;width:clamp(110px,16vw,210px);transform:rotate(4deg);pointer-events:none}
.deco{position:absolute;pointer-events:none;opacity:.8}

/* GIFTS */
.gifts-title{font:800 clamp(2rem,5vw,3.2rem)/1 var(--f-title);color:#d6477a;margin:0;text-align:center}
.gifts-sub{font:600 clamp(.95rem,2.4vw,1.4rem) var(--f-pop);color:#a8506d;margin:0 0 1.5rem;text-align:center}
.giftrow{display:flex;justify-content:space-around;gap:1rem;width:100%;max-width:1100px;flex-wrap:wrap}
.gift{width:clamp(120px,24vw,270px);position:relative;-webkit-tap-highlight-color:transparent;padding:0}
.gift[hidden]{display:none}
.gb{position:relative;display:block;width:100%;aspect-ratio:616/696;animation:gfloat 4.2s ease-in-out infinite;transition:scale .25s cubic-bezier(.2,.9,.3,1.4)}
.gift:nth-child(2) .gb{animation-delay:-1.4s}.gift:nth-child(3) .gb{animation-delay:-2.8s}
.gift:hover .gb,.gift:focus-visible .gb{scale:1.07}
.gbody,.glid,.gin,.gbeam{position:absolute;inset:0;display:block}
.gbody,.glid{background:var(--gi) center/100% 100% no-repeat;filter:drop-shadow(0 8px 8px rgba(150,70,95,.22))}
.gbody{clip-path:polygon(0 48.1%,3.2% 48.1%,49.5% 62.1%,96.8% 48.1%,100% 48.1%,100% 100%,0 100%)}
.glid{clip-path:polygon(0 0,100% 0,100% 48.1%,96.8% 48.1%,49.5% 62.1%,3.2% 48.1%,0 48.1%);transform-origin:50% 60%}
.gin{clip-path:polygon(3.2% 48.1%,49.5% 35%,96.8% 48.1%,49.5% 62.1%);background:radial-gradient(60% 70% at 50% 55%,#fff6e4,#ffd7e2 45%,#7fb0d4 100%);opacity:0}
.gbeam{opacity:0;inset:auto 14% 52% 14%;height:95%;background:linear-gradient(to top,rgba(255,244,210,.95),rgba(255,230,240,.5) 55%,rgba(255,255,255,0));clip-path:polygon(34% 100%,66% 100%,100% 0,0 0);transform-origin:50% 100%}
.gshadow{position:absolute;left:12%;right:12%;bottom:-3%;height:9%;border-radius:50%;background:radial-gradient(ellipse,rgba(120,60,85,.32),rgba(120,60,85,0) 70%);animation:gshadow 4.2s ease-in-out infinite}
.gift:nth-child(2) .gshadow{animation-delay:-1.4s}.gift:nth-child(3) .gshadow{animation-delay:-2.8s}
.gsp{position:absolute;width:11%;aspect-ratio:1;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:gtwinkle 3s ease-in-out infinite;filter:drop-shadow(0 0 4px #fff)}
.gsp.s1{left:-4%;top:12%}.gsp.s2{right:-3%;top:34%;animation-delay:1s;width:8%}.gsp.s3{left:8%;bottom:14%;animation-delay:2s;width:7%}
.gift:nth-child(2) .gsp{animation-delay:.7s}.gift:nth-child(3) .gsp{animation-delay:1.6s}
@keyframes gfloat{0%,100%{translate:0 0;rotate:-1.6deg}50%{translate:0 -4.5%;rotate:1.6deg}}
@keyframes gshadow{0%,100%{scale:1;opacity:.9}50%{scale:.78;opacity:.55}}
@keyframes gtwinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(70deg)}}
.gplay .gift{animation:gdrop 1s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--k,0)*.2s + .25s)}
@keyframes gdrop{0%{opacity:0;transform:translateY(-70vh) rotate(-10deg) scale(.7)}55%{opacity:1;transform:translateY(0) rotate(2deg) scale(1.04,.95)}75%{transform:translateY(-3%) scale(.99,1.03)}100%{opacity:1;transform:none}}
.gplay .gifts-title,.gplay .gifts-sub{animation:dropIn .8s cubic-bezier(.2,.9,.3,1.2) both}
.gplay .gifts-sub{animation-delay:.12s}
/* opening */
.gift.opening{pointer-events:none;z-index:5}
.opening .gb{animation:gshake .55s ease-in-out both,gjump .5s ease-out .55s both;scale:1}
.opening .gshadow{animation:none}
.opening .glid{animation:lidOpen 1.5s cubic-bezier(.3,.1,.3,1) .55s both}
.opening .gin{animation:inGlow 1.6s ease-out .55s both}
.opening .gbeam{animation:beam 1.5s ease-out .6s both}
.opening .gsp{animation-duration:.5s}
@keyframes gshake{0%,100%{rotate:0deg;translate:0 0}15%{rotate:-6deg;translate:-2% 0}30%{rotate:6deg;translate:2% 0}45%{rotate:-5deg;translate:-1.5% 0}60%{rotate:5deg;translate:1.5% 0}80%{rotate:-2deg;translate:0 0;scale:1.04 .96}}
@keyframes gjump{0%{translate:0 0;scale:1.04 .94}40%{translate:0 -6%;scale:.96 1.06}100%{translate:0 0;scale:1}}
@keyframes lidOpen{0%{transform:none;opacity:1}35%{transform:translateY(-42%) rotate(-9deg);opacity:1}70%{transform:translateY(-82%) rotate(-18deg) scale(1.05);opacity:1}100%{transform:translateY(-120%) rotate(-28deg) scale(1.1);opacity:0}}
@keyframes inGlow{0%{opacity:0}20%{opacity:1}100%{opacity:1}}
@keyframes beam{0%{opacity:0;transform:scaleY(.1)}25%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1.25)}}
.done{font:italic 700 1.8rem var(--f-script);color:var(--berry);text-align:center}
.replay{margin-top:.5rem}

/* TULIPS */
.tul{min-height:100%;position:relative;display:grid;grid-template-columns:1fr minmax(240px,380px) 1fr;gap:1rem;max-width:1200px;margin:auto;align-items:start;padding-top:2.6rem}
.tul h2{position:absolute;top:.4rem;left:0;right:0;text-align:center;margin:0;font:800 clamp(1.5rem,3.6vw,2.4rem) var(--f-title);color:#b8456a}
.col{display:flex;flex-direction:column;gap:2.2rem;justify-content:space-around;align-self:stretch;padding-top:2.5rem}
.bubble{background:#fff3ea;border:2px solid #e9b9bf;border-radius:18px 18px 18px 6px;padding:.9rem 1.2rem;font:italic 700 clamp(1.05rem,2.2vw,1.5rem)/1.25 var(--f-hand);color:#7a4455;box-shadow:0 5px 10px rgba(194,68,109,.14);max-width:260px;position:relative;opacity:0;transform:translateY(12px) scale(.96);transition:.6s}
.col.r .bubble{margin-left:auto;border-radius:18px 18px 6px 18px}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;bottom:-10px;left:22px;width:16px;height:16px;background:inherit;border:inherit;border-top:0;border-left:0;transform:skewX(-35deg) rotate(20deg);border-radius:0 0 6px 0;z-index:-1}
.col.r .bubble::after{left:auto;right:22px;transform:skewX(35deg) rotate(-20deg)}
.vase{background:#fff2e8;border:5px solid #e08a9d;border-radius:40px 40px 6px 6px;padding:1rem .6rem 0;filter:drop-shadow(0 8px 10px rgba(194,68,109,.18));
  -webkit-mask:none;position:relative;overflow:hidden}
.vase svg{width:100%;height:auto;display:block}
.tul .next{top:3.2rem;right:1rem}

/* PLAYLIST */
#s-pl{background:linear-gradient(#fdeef3 0,#fcd9e4 45%,#f6a7c0 100%)}
.pl{min-height:100%;max-width:1200px;margin:auto;position:relative;display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:1.5rem;align-items:center}
.pl h2{font:600 clamp(1.8rem,4.5vw,3rem) var(--f-serif);color:#5b2438;margin:0;text-align:center}
.pl .sub{font:italic 700 clamp(1.1rem,2.4vw,1.6rem) var(--f-script);color:#7b3a53;text-align:center;margin:.2rem 0 1rem}
.player{background:#0b0b0d;border-radius:18px;padding:.9rem;color:#fff;font-family:var(--f-title);box-shadow:0 10px 24px rgba(0,0,0,.25);align-self:start;margin-top:1rem}
.cover{aspect-ratio:1;border-radius:6px;background:linear-gradient(145deg,#ff6fa0,#f04a82 60%,#e0356f);display:grid;place-items:center;text-align:center;color:#fff;padding:.6rem;line-height:1}
.cover b{font:800 clamp(2.2rem,5vw,3.2rem)/.9 var(--f-title);text-transform:uppercase;letter-spacing:.02em;display:block;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.cover small{font:700 .95rem var(--f-title);letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.prow{display:flex;justify-content:space-between;align-items:center;margin:.8rem .3rem .4rem;font-size:1.1rem}
.prow .g{color:#2fd065}
.bar{height:4px;background:#4a4a4f;border-radius:3px;margin:.2rem .3rem;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:3px;width:0}
.bar i::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:.62rem;color:#aaa;margin:.2rem .3rem}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin:.3rem .5rem .1rem;color:#ddd}
.play{width:46px;height:46px;border-radius:50%;border:2px solid #2fd065;display:grid;place-items:center;color:#fff}
.addsong{display:block;margin-top:.7rem;text-align:center;font-size:.78rem;color:#cfcfd4;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.addsong input{position:absolute;opacity:0;width:1px;height:1px}
.vinyl{width:min(62vw,360px);aspect-ratio:1;border-radius:50%;margin:0 auto;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#0c0c0c 0 2px,#1a1a1a 2px 3px),#0c0c0c;
  box-shadow:0 14px 28px rgba(0,0,0,.3)}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.16) 14%,transparent 20% 50%,rgba(255,255,255,.16) 64%,transparent 70%)}
.label{position:absolute;inset:32%;border-radius:50%;background:radial-gradient(circle,#f4a1b4 0 55%,#ef7f9c);border:10px solid #0a0a0a;display:grid;place-items:center}
.label::after{content:"";width:12px;height:12px;border-radius:50%;background:#fff7}
.vinyl.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage-r{position:relative;display:flex;flex-direction:column;justify-content:center}
.notes{position:absolute;width:clamp(120px,22vw,260px);pointer-events:none}

/* LETTER */
#s-letter{background:linear-gradient(#fde8ee,#fbd3de)}
.lt{min-height:100%;max-width:1100px;margin:auto;position:relative;padding-top:.5rem}
.lt h2{font:800 clamp(1.6rem,4vw,2.6rem) var(--f-title);color:#e8506f;margin:.2rem 0 1rem}
.paper{margin:0 auto;width:min(760px,86%);background:repeating-linear-gradient(transparent 0 38px,#d9b98e 38px 40px),#f3dcb4;padding:1.6rem 1.6rem 1rem 2.4rem;position:relative;
  clip-path:polygon(0 3%,4% 0,9% 2%,15% 0,22% 2%,30% 0,38% 1%,47% 0,55% 2%,64% 0,72% 2%,80% 0,88% 1%,95% 0,100% 3%,100% 97%,95% 100%,88% 98%,80% 100%,70% 98%,60% 100%,50% 98%,40% 100%,30% 98%,20% 100%,10% 98%,5% 100%,0 97%);
  box-shadow:0 8px 20px rgba(0,0,0,.15)}
.paper::before{content:"";position:absolute;left:1.4rem;top:0;bottom:0;width:2px;background:#e1b7a0}
.paper p{margin:0;font:700 clamp(.95rem,2.2vw,1.35rem)/40px var(--f-title);color:#6a2a1c}
.sign{text-align:right;font:800 clamp(1rem,2.4vw,1.5rem)/40px var(--f-title);color:#e8506f;margin-top:.2rem}
.cat{position:absolute;left:-1%;bottom:0;width:clamp(100px,17vw,200px);pointer-events:none}
.orchid{position:absolute;right:1%;top:4rem;width:clamp(60px,10vw,120px);pointer-events:none}
.lt .next{top:.8rem}

@media (max-width:760px){
  .lock{grid-template-columns:1fr;gap:1rem;padding-top:1.5rem}
  .pics{margin:0;max-width:340px}
  .bow-tr{width:90px}
  .tul{grid-template-columns:1fr;padding-top:3rem}
  .col{padding-top:0;gap:1.4rem}.col .bubble,.col.r .bubble{margin:0 auto}
  .col.r{order:3}
  .pl{grid-template-columns:1fr}
  .player{max-width:260px;margin:0 auto}
  .paper{width:100%;padding-left:1.8rem}
  .orchid{display:none}
  .cat{position:relative;display:block;margin-top:.5rem}
}

/* extras: names line, track list, customize screen */
.forline{white-space:pre-line;margin:-.8rem 0 1.2rem;font:700 .95rem/1.4 var(--f-title);color:#a24a6a;text-align:center}
.skip{font-size:1.1rem;color:#ddd;padding:.3rem}
.tracks{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:0 0 1rem}
.track{background:rgba(255,255,255,.65);border:1px solid #f0c3d0;border-radius:999px;padding:.2rem .8rem;font:700 .85rem var(--f-title);color:#7b3a53}
.track.on{background:var(--berry);color:#fff;border-color:var(--berry)}
.sign .from{font:italic 700 1.1rem var(--f-hand);color:#8a3b4a}
.editbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:20;background:#fff6ec;border:1px solid #f1dcd5;border-radius:999px;padding:.4rem 1rem;font:700 .85rem var(--f-title);color:var(--berry);box-shadow:0 3px 8px rgba(194,68,109,.18)}
.editbtn[hidden],#editor[hidden]{display:none}
#editor{position:fixed;inset:0;z-index:50;overflow:auto;background:#fff1f4;color:var(--wine);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.edwrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.edhead{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.edhead h2{margin:0;font:800 1.7rem var(--f-title);color:#d6477a}
.edsec{background:#fff;border:1px solid #f3d3dc;border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.edsec h3{margin:0;font:800 1.15rem var(--f-title);color:var(--berry)}
.fld{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.fld label{font:700 .85rem var(--f-title);color:var(--wine)}
.fld input,.fld textarea{font:500 1rem var(--f-title);color:var(--ink);background:#fffafb;border:1.5px solid #efc3cf;border-radius:10px;padding:.55rem .7rem;width:100%;min-width:0}
.fld textarea{resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus{outline:3px solid #f3a9bb;outline-offset:1px}
.fld small,.hint{font:500 .82rem/1.4 var(--f-title);color:#9a6075;margin:0}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.srow{border-top:1px dashed #efc3cf;padding-top:.8rem;display:flex;flex-direction:column;gap:.6rem}
.sfile,.phrow{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.filebtn{position:relative;display:inline-block;background:#fff6ec;border:1px solid #efc3cf;border-radius:999px;padding:.3rem .9rem;font:700 .85rem var(--f-title);color:var(--berry);cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--berry);outline-offset:2px}
.fstat{font:500 .82rem var(--f-title);color:#9a6075;min-width:0;overflow-wrap:anywhere}
.mini{background:#fff6ec;border:1px solid #efc3cf;border-radius:999px;padding:.3rem .9rem;font:700 .85rem var(--f-title);color:var(--wine)}
.mini.add{align-self:flex-start;color:var(--berry)}

/* tulips page (matches the reference layout) */

.tframe{position:relative;margin:.3rem 0 .2rem;padding:20px}

/* entrance */

@keyframes dropIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes letter{0%{opacity:0;transform:translateY(-34px) scale(.5) rotate(-12deg)}60%{opacity:1;transform:translateY(5px) scale(1.12) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

@keyframes bloom{from{clip-path:circle(0% at 50% 64%);transform:scale(1.25);filter:saturate(.4) brightness(1.15)}to{clip-path:circle(75% at 50% 64%);transform:scale(1);filter:none}}

@keyframes capIn{from{opacity:0;transform:translateY(10px);letter-spacing:.2em}to{opacity:1;transform:none;letter-spacing:0}}

/* letter page (matches the reference) */

  background:radial-gradient(60% 40% at 80% 0,rgba(255,255,255,.35),transparent),radial-gradient(50% 50% at 10% 100%,rgba(190,140,80,.18),transparent),linear-gradient(#f3e1bd,#ecd5aa);
  clip-path:polygon(0 2%,3% 0,7% 1.5%,12% .2%,18% 1.6%,25% 0,33% 1.4%,41% .3%,49% 1.8%,57% 0,65% 1.5%,73% .2%,81% 1.8%,88% .4%,94% 1.6%,100% 0,99.4% 30%,100% 62%,99.3% 97%,95% 99.2%,89% 98%,82% 100%,74% 98.4%,65% 99.8%,56% 98.2%,47% 100%,38% 98.6%,29% 99.8%,20% 98.4%,12% 100%,5% 98.6%,0 99.6%,.6% 65%,0 32%)}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.95em - 2px),rgba(128,92,56,.42) calc(1.95em - 2px),rgba(128,92,56,.42) 1.95em) 0 1.2em/100% 100% no-repeat;
  -webkit-mask:linear-gradient(#000,#000);}

#letterBody,.sign{position:relative;z-index:1}

.lskip .wd,.lskip .sign{animation-delay:0s!important}
/* letter animation */
.lplay .ltitle{animation:dropIn .8s cubic-bezier(.2,.9,.3,1.2) both}
.lplay .sheetw{animation:unroll 1.1s cubic-bezier(.2,.8,.2,1) .35s both}

@keyframes unroll{0%{opacity:0;transform:perspective(900px) rotateX(-70deg) scaleY(.2)}60%{opacity:1;transform:perspective(900px) rotateX(8deg) scaleY(1.02)}100%{opacity:1;transform:none}}

@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
@keyframes peek{0%{opacity:0;transform:translateY(60%) rotate(-8deg) scale(.8)}55%{opacity:1;transform:translateY(-6%) rotate(3deg) scale(1.04)}80%{transform:translateY(2%) rotate(-1deg)}100%{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg) scaleY(1)}25%{transform:rotate(0) scaleY(.985) scaleX(1.01)}50%{transform:rotate(1.6deg) scaleY(1)}75%{transform:rotate(0) scaleY(.985) scaleX(1.01)}}
@keyframes hop{0%{transform:none}30%{transform:translateY(-14%) scale(.96,1.05)}55%{transform:translateY(0) scale(1.06,.93)}75%{transform:translateY(-6%)}100%{transform:none}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.12,.86)}60%{transform:scale(.94,1.08)}100%{transform:none}}
@keyframes orchIn{from{opacity:0;transform:translateY(-30px) rotate(-8deg)}to{opacity:1;transform:none}}

/* lock screen (matches the reference) */

@keyframes rainfall{0%{transform:translate(0,-8vh) rotate(-12deg)}25%{transform:translate(18px,26vh) rotate(10deg)}50%{transform:translate(-16px,55vh) rotate(-10deg)}75%{transform:translate(16px,84vh) rotate(12deg)}100%{transform:translate(-4px,112vh) rotate(-8deg)}}
.bowtr{position:absolute;right:0;top:0;width:clamp(120px,21.5vw,260px);height:auto;transform-origin:62% 18%;animation:bowSway 5.5s ease-in-out infinite alternate;pointer-events:none;z-index:2}

@keyframes kin{from{opacity:0;transform:translateY(18px) scale(.6)}to{opacity:1;transform:none}}

/* playlist page (matches the reference) */
#s-pl{background:linear-gradient(#fefafb 0,#fdeef3 28%,#fbdde8 52%,#f8c5d8 74%,#f3a9c6 100%);overflow-x:hidden}
#s-pl::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(176deg,rgba(255,255,255,0) 0 22px,rgba(255,255,255,.22) 22px 30px,rgba(255,255,255,0) 30px 58px),radial-gradient(70% 30% at 20% 60%,rgba(255,255,255,.35),transparent 70%),radial-gradient(60% 25% at 85% 78%,rgba(255,255,255,.3),transparent 70%);filter:blur(3px);opacity:.8}
.stTR{position:fixed;right:0;top:9%;width:clamp(140px,29.5vw,360px);height:auto;pointer-events:none;z-index:1;transform-origin:30% 90%}
.stBL{position:fixed;left:0;bottom:0;width:clamp(140px,29.5vw,360px);height:auto;pointer-events:none;z-index:1;transform-origin:70% 30%}
.p2{position:relative;z-index:3;min-height:100%;max-width:1300px;margin:0 auto;display:grid;grid-template-columns:minmax(190px,22%) 1fr minmax(120px,22%);align-items:start;gap:1rem}
.p2card{background:#0b0b0c;border-radius:14px;padding:.6rem .55rem .7rem;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.28);font-family:var(--f-dm);margin-top:.2rem}
.p2cover{aspect-ratio:1.04;border-radius:4px;background:linear-gradient(150deg,#ff7aa6,#f2578c 55%,#e84a82);background-size:cover;background-position:center;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative}
.p2ct{padding:.4rem;line-height:.95;color:#fff;text-transform:uppercase}
.p2ct b{display:block;font:400 clamp(2.2rem,5.2vw,3.6rem)/.9 var(--f-bebas);letter-spacing:.02em}
.p2ct small{display:block;margin-top:.3rem;font:400 clamp(1rem,2.2vw,1.45rem)/1 var(--f-bebas);letter-spacing:.06em}
.p2row{display:flex;justify-content:space-between;align-items:center;margin:.8rem .7rem .55rem;color:#cfcfd2}
.p2row svg{width:17px;height:17px}
.p2row .p2heart{width:20px;height:19px;color:#1ed760}
.p2bar{height:3px;background:#555;border-radius:2px;margin:.2rem .15rem;position:relative}
.p2bar i{position:absolute;left:0;top:0;bottom:0;background:#1ed760;border-radius:2px;width:25%}
.p2bar i::after{content:"";position:absolute;right:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff}
.p2times{display:flex;justify-content:space-between;font-size:.55rem;color:#aaa;margin:.25rem .15rem .1rem}
.p2ctrl{display:flex;justify-content:space-between;align-items:center;margin:.35rem .35rem 0;color:#e5e5e7}
.p2ctrl>svg{width:15px;height:15px;color:#bbb}
.p2skip{color:#fff;display:grid;place-items:center;padding:.2rem}
.p2skip svg{width:17px;height:17px}
.p2play{width:44px;height:44px;border-radius:50%;border:2px solid #1ed760;display:grid;place-items:center;color:#fff;transition:transform .15s}
.p2play:active{transform:scale(.9)}
.p2play svg{width:18px;height:18px}
.p2mid{display:flex;flex-direction:column;align-items:center;min-width:0}
.p2title{margin:.2rem 0 0;font:600 clamp(1.7rem,3.9vw,2.9rem)/1.1 var(--f-serif);color:#5a2438;text-align:center;text-wrap:balance}
.p2title .w{display:inline-block;white-space:nowrap}
.p2title .ch{display:inline-block}
.p2sub{margin:.35rem 0 1rem;font:400 clamp(1.1rem,2.3vw,1.7rem)/1.2 var(--f-vibes);color:#6c3a52;text-align:center}
.tracks[hidden]{display:none}
.vwrap{position:relative;width:min(37vw,66vh,440px);min-width:200px;aspect-ratio:1;margin-top:.2rem}
.vring{position:absolute;inset:-4%;border-radius:50%;border:3px solid rgba(238,79,130,.5);opacity:0;pointer-events:none}
.vdisc{position:absolute;inset:0;border-radius:50%;cursor:pointer;background:repeating-radial-gradient(circle at 50% 50%,#070707 0 2px,#0f0f0f 2px 4px),#080808;box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 0 0 5px #0c0c0c}
.vdisc::after{content:"";position:absolute;inset:30.5%;border-radius:50%;background:#050505;box-shadow:0 0 0 2px #000}
.vlabel{position:absolute;inset:32.2%;width:35.6%;height:35.6%;border-radius:50%;z-index:2;display:block}
.vglow{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 12deg,transparent 0 3%,rgba(255,255,255,.3) 10%,rgba(255,255,255,.08) 16%,transparent 22% 47%,rgba(255,255,255,.3) 60%,rgba(255,255,255,.08) 66%,transparent 72%);-webkit-mask:radial-gradient(circle,transparent 0 31%,#000 32%);mask:radial-gradient(circle,transparent 0 31%,#000 32%)}
.vdisc.spin{animation:vspinUp 1.4s cubic-bezier(.4,0,.8,.6) both,vspin 3.2s linear 1.4s infinite}
@keyframes vspinUp{from{transform:rotate(0)}to{transform:rotate(300deg)}}
@keyframes vspin{from{transform:rotate(300deg)}to{transform:rotate(660deg)}}
.isplay .vring{animation:ringPulse 1.5s ease-out infinite}
.isplay .p2cover{animation:coverBeat 1.2s ease-in-out infinite}
.isplay .p2heart{animation:beat 1.2s ease-in-out infinite}
.isplay .stTR{animation:staveWave 2.4s ease-in-out infinite alternate}
.isplay .stBL{animation:staveWave 2.8s ease-in-out infinite alternate-reverse}
@keyframes ringPulse{0%{opacity:.9;transform:scale(.98)}100%{opacity:0;transform:scale(1.14)}}
@keyframes coverBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.nt{position:fixed;z-index:6;pointer-events:none;color:#2a1520;line-height:0}
.nt svg{display:block;width:100%;height:100%}
.p2next{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:6}
/* playlist animation */
.plplay .p2card{animation:cardIn 1s cubic-bezier(.2,.9,.3,1.2) .2s both}
.plplay .p2title .ch{animation:letter .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*40ms + .35s)}
.plplay .p2sub{animation:subWrite 1.4s ease-out 1.1s both}
.plplay .vwrap{animation:vIn 1.5s cubic-bezier(.2,.9,.3,1.15) .6s both}
.plplay .stTR{animation:stIn 1.3s ease-out .9s both,staveWave 4.5s ease-in-out 2.3s infinite alternate}
.plplay .stBL{animation:stIn 1.3s ease-out 1.1s both,staveWave 5s ease-in-out 2.4s infinite alternate-reverse}
.plplay .p2next{animation:dropIn .8s ease 1.8s both}
.plplay.isplay .stTR{animation:stIn 1.3s ease-out .9s both,staveWave 2.4s ease-in-out 2.3s infinite alternate}
@keyframes cardIn{from{opacity:0;transform:translateX(-60px) rotate(-8deg) scale(.85)}60%{opacity:1;transform:translateX(6px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes subWrite{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes vIn{from{opacity:0;transform:scale(.2) rotate(-220deg)}65%{opacity:1;transform:scale(1.05) rotate(12deg)}to{opacity:1;transform:none}}
@keyframes stIn{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes staveWave{from{transform:rotate(-1.5deg) translateY(-3px)}to{transform:rotate(1.5deg) translateY(4px) skewX(-1deg)}}
@media (max-width:760px){
  .p2{grid-template-columns:1fr;gap:.6rem}
  .p2mid{order:1}
  .p2card{order:2;width:min(240px,70vw);margin:.5rem auto 4rem}
  .vwrap{width:min(72vw,52vh);}
  .stTR{top:21%;width:40vw;opacity:.9}
  .stBL{width:42vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bubble{opacity:1;transform:none}}

  $('#sheetw').addEventListener('click',function(){ $('#s-letter').classList.add('lskip'); });

  function renderAll(){
    $('#lockTitle').textContent=S.lockTitle;

  }

  /* ---- customize screen ---- */
  var ed=$('#editor'), rows=[], resetArmed=false;
  function fld(id,label,val,opts){
    opts=opts||{};
    var inp= opts.area ? '<textarea id="'+id+'" rows="'+opts.area+'">'+esc(val)+'</textarea>'
      : '<input id="'+id+'" type="text" value="'+esc(val)+'"'+(opts.max?' maxlength="'+opts.max+'"':'')+(opts.pin?' inputmode="numeric" pattern="[0-9]*" autocomplete="off"':'')+'>';
    return '<div class="fld"><label for="'+id+'">'+label+'</label>'+inp+(opts.hint?'<small>'+opts.hint+'</small>':'')+'</div>';
  }
  function songRow(r,k){
    return '<div class="srow" data-k="'+k+'"><div class="sgrid">'+
      '<div class="fld"><label for="st'+k+'">Song title</label><input id="st'+k+'" type="text" value="'+esc(r.title)+'"></div>'+
      '<div class="fld"><label for="sa'+k+'">Artist</label><input id="sa'+k+'" type="text" value="'+esc(r.artist||'')+'"></div></div>'+
      '<div class="sfile"><label class="filebtn">Attach mp3<input type="file" accept="audio/*,.mp3" data-k="'+k+'"></label>'+
      '<div class="fld" style="flex-basis:100%"><label for="su'+k+'">Or a direct link to the song (works inside the shared link)</label><input id="su'+k+'" type="url" placeholder="https://.../song.mp3" value="'+esc(r.url||'')+'"></div>'+
      '<span class="fstat" id="sf'+k+'">'+(r.newFile?esc(r.newFile.name):(r.file?'mp3 attached':'no mp3 yet'))+'</span>'+
      '<button type="button" class="mini" data-rm="'+k+'">Remove</button></div></div>';
  }
  function songsHtml(){ return rows.map(songRow).join('') || '<p class="hint">No songs yet. Add one below.</p>'; }
  function readRows(){ rows.forEach(function(r,k){ var t=$('#st'+k), a=$('#sa'+k), u=$('#su'+k); if(t) r.title=t.value; if(a) r.artist=a.value; if(u) r.url=u.value.trim(); }); }
  function openEditor(){
    rows=S.songs.map(function(s){return {id:s.id,title:s.title,artist:s.artist,url:s.url||'',file:!!s.file,newFile:null}});
    var hasP=function(i){ try{return !!localStorage.getItem('gift-photo-'+i)}catch(e){return false} };
    ed.innerHTML=
     '<div class="edwrap"><header class="edhead"><h2>Customize your gift</h2><button type="button" class="mini" id="edClose">Close</button></header>'+
     '<p class="hint">Replace the examples with your own. Your changes are saved in this browser and shown straight away.</p>'+
     '<section class="edsec"><h3>Secret code</h3>'+fld('e_code','4-digit PIN',S.code,{max:4,pin:1,hint:'Only the two of you should know it.'})+fld('e_lock','Title on the code screen',S.lockTitle)+'</section>'+
     '<section class="edsec"><h3>Names and details</h3><div class="sgrid">'+fld('e_to','Their name',S.toName)+fld('e_from','Your name',S.fromName)+'</div>'+
       fld('e_date','Special date',S.date,{hint:'For example: Happy birthday, 3 June'})+fld('e_note','Little note on the gifts screen',S.note)+'</section>'+
     '<section class="edsec"><h3>Photos</h3><p class="hint">You can also tap the heart frames on the code screen.</p><div class="phrow">'+
       '<label class="filebtn">Photo 1<input type="file" accept="image/*" data-i="0"></label><span class="fstat" id="edPh0">'+(hasP(0)?'Photo 1 added':'not added')+'</span>'+
       '<label class="filebtn">Photo 2<input type="file" accept="image/*" data-i="1"></label><span class="fstat" id="edPh1">'+(hasP(1)?'Photo 2 added':'not added')+'</span></div></section>'+
     '<section class="edsec"><h3>Surprise screen</h3>'+fld('e_gt','Title',S.giftsTitle)+fld('e_gs','Subtitle',S.giftsSub)+fld('e_fin','Message after the last gift',S.finalMessage)+'</section>'+
     '<section class="edsec"><h3>Flower messages</h3>'+fld('e_tt','Page title',S.tulipsTitle)+
       fld('e_tc','Caption on the photo',S.tulipsCaption)+'<div class="phrow"><label class="filebtn">Change bouquet photo<input type="file" accept="image/*" data-bq="1"></label><span class="fstat" id="edBq"></span></div>'+
       [0,1,2,3,4,5].map(function(i){return fld('e_t'+i,'Message '+(i+1),S.tulips[i]||'')}).join('')+'</section>'+
     '<section class="edsec"><h3>Playlist</h3>'+fld('e_pt','Page title',S.plTitle)+fld('e_ps','Subtitle',S.plSub)+
       '<div class="phrow"><label class="filebtn">Album cover image<input type="file" accept="image/*" data-cv="1"></label><span class="fstat" id="edCv"></span></div><div id="songRows">'+songsHtml()+'</div><button type="button" class="mini add" id="addSong">+ Add a song</button>'+
       '<p class="hint">Attach an mp3 to a song so it plays on the page. Songs without an mp3 only show their name and spin the record.</p></section>'+
     '<section class="edsec"><h3>Love letter</h3>'+fld('e_lt','Letter title',S.letterTitle)+fld('e_l','Your letter',S.letter,{area:9,hint:'Press Enter for a new paragraph.'})+fld('e_sg','Sign-off',S.sign)+'</section>'+
     '<div class="edbar"><button type="button" class="save" id="edSave">Save and preview</button><button type="button" class="mini" id="edReset">Reset to examples</button></div>'+
     (STANDALONE?'<section class="edsec"><h3>Create a link to your gift</h3><p class="hint">Make one link with everything you customized (texts, PIN, photos, flower messages, letter). Send it to your person and the gift opens for them exactly as you made it. Songs are added by their direct mp3 link; an attached mp3 file cannot fit inside a link.</p><div class="phrow"><button type="button" class="save" id="edGLink">Create my gift link</button></div><div id="edLinkBox" hidden><input type="text" id="edLinkUrl" readonly style="width:100%;padding:.6rem;border:1.5px solid #f0c6d2;border-radius:10px;font:inherit"><div class="phrow"><button type="button" class="mini" id="edCopy">Copy link</button> <a id="edOpen" target="_blank" rel="noopener" class="mini" style="text-decoration:none">Open</a></div></div></section><section class="edsec"><h3>Publish as a website</h3><p class="hint">When you are happy with everything, export one ready-to-use index.html. It holds your photos, songs and texts, so you can upload it to any web host and send the link.</p><label class="hint"><input type="checkbox" id="e_hide" checked> Hide the Customize button in the exported website</label><div class="phrow"><button type="button" class="save" id="edExport">Export my website</button></div></section>'
       :'<section class="edsec"><h3>Get your link</h3><p class="hint">Only you can see this Customize panel. When you are done, create a link to your finished version. The link opens the gift for your person with no Customize option. Share this page with them (Share menu) so the link opens for them.</p><div class="phrow"><button type="button" class="save" id="edLink">Create my link</button></div><div id="edLinkBox" hidden><input type="text" id="edLinkUrl" readonly style="width:100%;padding:.6rem;border:1.5px solid #f0c6d2;border-radius:10px;font:inherit"><div class="phrow"><button type="button" class="mini" id="edCopy">Copy link</button> <a id="edOpen" target="_blank" rel="noopener" class="mini" style="text-decoration:none">Open</a></div></div></section>')+
     '<div class="edbar" style="border-top:0"><span class="edmsg" id="edMsg" role="status"></span></div></div>';
    ed.hidden=false; ed.scrollTop=0; resetArmed=false;
  }
  function closeEditor(){ ed.hidden=true; ed.innerHTML=''; }
  $('#editBtn').onclick=openEditor;
  ed.addEventListener('change',function(e){
    var t=e.target;
    if(t.type==='file' && t.hasAttribute('data-i')){ handlePhoto(t); return; }
    if(t.type==='file' && t.hasAttribute('data-cv')){
      if(!t.files[0]) return; var fr2=new FileReader();
      fr2.onload=function(){ var im2=new Image(); im2.onload=function(){ var c=document.createElement('canvas'), sc=Math.min(1,500/Math.max(im2.width,im2.height)); c.width=im2.width*sc; c.height=im2.height*sc; c.getContext('2d').drawImage(im2,0,0,c.width,c.height); var u=c.toDataURL('image/jpeg',.85); try{localStorage.setItem('gift-cover',u)}catch(x){} renderPlaylist(); var st=$('#edCv'); if(st) st.textContent='Cover added'; }; im2.src=fr2.result; };
      fr2.readAsDataURL(t.files[0]); return;
    }
    if(t.type==='file' && t.hasAttribute('data-bq')){
      if(!t.files[0]) return; var fr=new FileReader();
      fr.onload=function(){ var im=new Image(); im.onload=function(){ var c=document.createElement('canvas'), sc=Math.min(1,900/Math.max(im.width,im.height)); c.width=im.width*sc; c.height=im.height*sc; c.getContext('2d').drawImage(im,0,0,c.width,c.height); var u=c.toDataURL('image/jpeg',.85); try{localStorage.setItem('gift-bouquet',u)}catch(x){} $('#tulImg').setAttribute('src',u); var st=$('#edBq'); if(st) st.textContent='Bouquet photo changed'; }; im.src=fr.result; };
      fr.readAsDataURL(t.files[0]); return;
    }
    if(t.type==='file' && t.hasAttribute('data-k')){ var k=+t.getAttribute('data-k'); if(t.files[0]){ rows[k].newFile=t.files[0]; var st=$('#sf'+k); if(st) st.textContent=t.files[0].name; if(!$('#st'+k).value.trim()) $('#st'+k).value=t.files[0].name.replace(/\.[^.]+$/,''); } }
  });
  ed.addEventListener('click',function(e){
    var t=e.target;
    if(t.id==='edClose'){ closeEditor(); return; }
    if(t.id==='edExport'){ exportSite(); return; }
    if(t.id==='edLink'){ publishVersion(); return; }
    if(t.id==='edGLink'){ makeGiftLink(); return; }
    if(t.id==='edCopy'){ var u=$('#edLinkUrl'); u.select(); try{ navigator.clipboard.writeText(u.value).then(function(){ $('#edMsg').textContent='Link copied.'; },function(){ document.execCommand('copy'); }); }catch(e){ try{document.execCommand('copy');}catch(_){} } return; }
    if(t.id==='addSong'){ readRows(); if(rows.length>=8){ $('#edMsg').textContent='Up to 8 songs.'; return; } rows.push({id:'s'+Date.now().toString(36),title:'New song',artist:'',file:false,newFile:null}); $('#songRows').innerHTML=songsHtml(); return; }
    if(t.hasAttribute('data-rm')){ readRows(); rows.splice(+t.getAttribute('data-rm'),1); $('#songRows').innerHTML=songsHtml(); return; }
    if(t.id==='edSave'){ save().catch(function(){}); return; }
    if(t.id==='edReset'){
      if(!resetArmed){ resetArmed=true; t.textContent='Click again to erase your changes'; return; }
      S.songs.forEach(function(s){ fdel('song-'+s.id); });
      rows.forEach(function(r){ fdel('song-'+r.id); });
      S=clone(DEFAULTS); try{ localStorage.removeItem('gift-cfg'); localStorage.removeItem('gift-photo-0'); localStorage.removeItem('gift-photo-1'); localStorage.removeItem('gift-bouquet'); localStorage.removeItem('gift-cover'); }catch(x){}
      clearPhoto(0); clearPhoto(1); idx=0; code=''; locked=false; $('#lockNext').hidden=true; draw(); renderAll(); closeEditor(); return;
    }
  });
  function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function exportSite(){
    var msgEl=$('#edMsg'); msgEl.textContent='Preparing your website\u2026';
    save(true).then(function(){
      var files={}, jobs=S.songs.filter(function(s){return s.file}).map(function(s){
        return fgetAny('song-'+s.id).then(function(b){ return b? blobToDataUrl(b).then(function(u){ if(u) files['song-'+s.id]=u; }) : null; });
      });
      return Promise.all(jobs).then(function(){ return files; });
    }).then(function(files){
      var baked={cfg:S,photos:[ls('gift-photo-0'),ls('gift-photo-1')],bouquet:ls('gift-bouquet'),cover:ls('gift-cover'),files:files,hideEdit:!!($('#e_hide')&&$('#e_hide').checked)};
      var json=JSON.stringify(baked).replace(/</g,'\\u003c');
      var html=SRC_HTML.replace(/<script id="baked"[^>]*>[\s\S]*?<\/script>/,function(){ return '<script id="baked" type="application/json">'+json+'<\/script>'; });
      var blob=new Blob([html],{type:'text/html'}), a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='index.html'; document.body.appendChild(a); a.click(); a.remove();
      msgEl.textContent='Done. Upload the downloaded index.html to any web host. If nothing downloaded, open the standalone website file and export from there.';
    }).catch(function(){ msgEl.textContent='Could not export. Try again from the standalone website file.'; });
  }
  function v(id){ var el=$('#'+id); return el?el.value:''; }
  function save(silent){
    var pin=v('e_code').trim();
    if(!/^\d{4}$/.test(pin)){ $('#edMsg').textContent='The PIN needs exactly 4 digits.'; $('#e_code').focus(); return Promise.reject(new Error('pin')); }
    readRows();
    var old=S.songs.map(function(s){return s.id});
    var jobs=[];
    var songs=rows.map(function(r){
      var s={id:r.id,title:(r.title||'').trim()||'Untitled',artist:(r.artist||'').trim(),url:/^https?:\/\//i.test(r.url||'')?r.url:'',file:r.file};
      if(r.newFile){ s.file=true; jobs.push(fset('song-'+r.id,r.newFile)); }
      return s;
    });
    old.forEach(function(id){ if(!songs.some(function(s){return s.id===id})) jobs.push(fdel('song-'+id)); });
    S.code=pin; S.lockTitle=v('e_lock')||DEFAULTS.lockTitle; S.toName=v('e_to').trim(); S.fromName=v('e_from').trim(); S.date=v('e_date').trim(); S.note=v('e_note').trim();
    S.giftsTitle=v('e_gt')||DEFAULTS.giftsTitle; S.giftsSub=v('e_gs'); S.finalMessage=v('e_fin');
    S.tulipsTitle=v('e_tt')||DEFAULTS.tulipsTitle; S.tulipsCaption=v('e_tc'); S.tulips=[0,1,2,3,4,5].map(function(i){return v('e_t'+i).trim()}).filter(Boolean);
    S.plTitle=v('e_pt')||DEFAULTS.plTitle; S.plSub=v('e_ps'); S.songs=songs;
    S.letterTitle=v('e_lt')||DEFAULTS.letterTitle; S.letter=v('e_l'); S.sign=v('e_sg');
    persist(); if(!silent) $('#edMsg').textContent='Saving\u2026';
    return Promise.all(jobs).then(function(){ if(silent){ renderAll(); return; } idx=0; code=''; locked=false; $('#lockNext').hidden=true; draw(); renderAll(); closeEditor(); go('s-lock'); });
  }

  function shrink(u,max,q){ return new Promise(function(res){ if(!u) return res(null); var im=new Image(); im.onload=function(){ var sc=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc)); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; im.onerror=function(){ res(null); }; im.src=u; }); }
  function pack(o){
    var cs=new Blob([new TextEncoder().encode(JSON.stringify(o))]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Response(cs).arrayBuffer().then(function(b){ var a=new Uint8Array(b), s=''; for(var i=0;i<a.length;i+=8192) s+=String.fromCharCode.apply(null,a.subarray(i,i+8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); });
  }
  function unpack(t){
    var s=atob(t.replace(/-/g,'+').replace(/_/g,'/')), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
    var ds=new Blob([a]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(ds).text().then(function(x){ return JSON.parse(x); });
  }
  function makeGiftLink(){
    var msgEl=$('#edMsg'), btn=$('#edGLink'); btn.disabled=true; msgEl.textContent='Preparing your link\u2026';
    save(true).then(function(){
      return Promise.all([shrink(ls('gift-photo-0'),380,.6),shrink(ls('gift-photo-1'),380,.6),shrink(ls('gift-bouquet'),340,.55),shrink(ls('gift-cover'),300,.55)]);
    }).then(function(im){
      var cfg=JSON.parse(JSON.stringify(S)); cfg.songs.forEach(function(s){ s.file=false; });
      return pack({cfg:cfg,p0:im[0],p1:im[1],bq:im[2],cv:im[3]});
    }).then(function(tok){
      var base=location.href.split('#')[0], url=base+'#g='+tok;
      $('#edLinkBox').hidden=false; $('#edLinkUrl').value=url; $('#edOpen').href=url; btn.disabled=false;
      var w=''; if(location.protocol==='file:') w=' Note: this page is opened from your computer. Upload the website first, then create the link from the hosted page.';
      msgEl.textContent='Link ready ('+Math.round(url.length/1000)+'k characters). Copy it and send it.'+w+(url.length>60000?' It is long; if a chat app cuts it, remove a photo.':'');
    }).catch(function(){ btn.disabled=false; msgEl.textContent='Could not create the link. Please try again.'; });
  }
  function applyGift(o){
    VERSION='link'; BAKED.files={}; BAKED.photos=[o.p0||null,o.p1||null]; BAKED.bouquet=o.bq||null; BAKED.cover=o.cv||null;
    S=Object.assign(clone(DEFAULTS),o.cfg||{});
    [0,1].forEach(function(i){ if(BAKED.photos[i]) setPhoto(i,BAKED.photos[i]); else clearPhoto(i); });
    renderAll(); code=''; locked=false; $('#lockNext').hidden=true; draw(); go('s-lock');
  }
  var ARTIFACT_URL='https://claude.ai/artifact/REdVfHpd9KBG2qPEYSXmdY';
  function san(s){ return String(s).replace(/[^A-Za-z0-9]/g,'_'); }
  function putBlob(key,str,prog){
    var n=Math.max(1,Math.ceil(str.length/200000)), i=0;
    function next(){ if(i>=n) return Promise.resolve(n);
      var piece=str.slice(i*200000,(i+1)*200000), k=i; i++;
      return DBH.doc('versions/'+prog.id+'/blobs/'+key+'_'+k).set({d:piece}).then(function(){ prog.done++; prog.say(); return next(); }); }
    return next();
  }
  function publishVersion(){
    var msgEl=$('#edMsg'), btn=$('#edLink');
    if(!DBH){ msgEl.textContent='Saving links is not available here.'; return; }
    btn.disabled=true; msgEl.textContent='Preparing\u2026';
    var id=''; var al='abcdefghjkmnpqrstuvwxyz23456789'; for(var i=0;i<9;i++) id+=al[Math.floor(Math.random()*al.length)];
    var blobs={}, songKeys={};
    save(true).then(function(){
      if(ls('gift-photo-0')) blobs.p0=ls('gift-photo-0'); if(ls('gift-photo-1')) blobs.p1=ls('gift-photo-1');
      if(ls('gift-bouquet')) blobs.bq=ls('gift-bouquet'); if(ls('gift-cover')) blobs.cv=ls('gift-cover');
      var jobs=S.songs.filter(function(s){return s.file}).map(function(s){
        return fgetAny('song-'+s.id).then(function(b){ return b?blobToDataUrl(b):null; }).then(function(u){ if(u&&u.length<9000000){ songKeys[s.id]='f_'+san(s.id); blobs[songKeys[s.id]]=u; } else if(u) msgEl.textContent='One mp3 is too large for a link (max about 6 MB) and was skipped.'; });
      });
      return Promise.all(jobs);
    }).then(function(){
      var keys=Object.keys(blobs), total=0; keys.forEach(function(k){ total+=Math.max(1,Math.ceil(blobs[k].length/200000)); });
      var prog={id:id,done:0,say:function(){ msgEl.textContent='Uploading '+prog.done+' / '+total+'\u2026'; }};
      var counts={}, chain=Promise.resolve();
      keys.forEach(function(k){ chain=chain.then(function(){ return putBlob(k,blobs[k],prog).then(function(n){ counts[k]=n; }); }); });
      return chain.then(function(){ return DBH.doc('versions/'+id).set({cfg:JSON.parse(JSON.stringify(S)),blobs:counts,songKeys:songKeys,created:Date.now()}); });
    }).then(function(){
      var url=ARTIFACT_URL+'#'+id; $('#edLinkBox').hidden=false; $('#edLinkUrl').value=url; $('#edOpen').href=url;
      try{ localStorage.setItem('gift-link',url); }catch(e){}
      msgEl.textContent='Your link is ready. Copy it and send it.'; btn.disabled=false;
    }).catch(function(e){ btn.disabled=false; msgEl.textContent=(e&&e.message==='pin')?'The PIN needs exactly 4 digits.':'Could not create the link. Please try again.'; });
  }
  function loadVersion(id){
    var root=$('#app'); root.style.visibility='hidden';
    return DBH.doc('versions/'+id).get().then(function(snap){
      if(!snap.exists) throw new Error('nf');
      var m=snap.data();
      return DBH.collection('versions/'+id+'/blobs').get().then(function(qs){
        var parts={}; qs.docs.forEach(function(d){ var nm=d.id, ix=nm.lastIndexOf('_'); var k=nm.slice(0,ix), n=+nm.slice(ix+1); (parts[k]=parts[k]||[])[n]=(d.data()||{}).d||''; });
        var out={}; Object.keys(parts).forEach(function(k){ out[k]=parts[k].join(''); });
        VERSION=id;
        var files={}; Object.keys(m.songKeys||{}).forEach(function(sid){ if(out[m.songKeys[sid]]) files['song-'+sid]=out[m.songKeys[sid]]; });
        BAKED.files=files; BAKED.photos=[out.p0||null,out.p1||null]; BAKED.bouquet=out.bq||null; BAKED.cover=out.cv||null;
        S=Object.assign(clone(DEFAULTS),m.cfg||{});
        [0,1].forEach(function(i){ if(BAKED.photos[i]) setPhoto(i,BAKED.photos[i]); else clearPhoto(i); });
        renderAll(); code=''; locked=false; $('#lockNext').hidden=true; draw(); go('s-lock');
      });
    }).catch(function(){ }).then(function(){ root.style.visibility=''; updEdit(); });
  }
  function updEdit(){ $('#editBtn').hidden = cur!=='s-lock' || !canEdit(); }
  renderAll(); go('s-lock');
  if(STANDALONE&&GPAY){
    $('#app').style.visibility='hidden';
    unpack(GPAY).then(applyGift).catch(function(){}).then(function(){ $('#app').style.visibility=''; updEdit(); });
  }
  if(!STANDALONE){
    if(VERID) $('#app').style.visibility='hidden';
    Promise.all([claude.use('user'),claude.use('db')]).then(function(r){
      DBH=r[1]; var u=r[0];
      return (u?u.isOwner():Promise.resolve(false)).then(function(o){ OWNER=!!o; updEdit(); if(VERID&&DBH) return loadVersion(VERID); $('#app').style.visibility=''; });
    }).catch(function(){ $('#app').style.visibility=''; });
    window.addEventListener('hashchange',function(){ location.reload(); });
  }
})();
